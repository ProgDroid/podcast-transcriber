[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Serverless podcast transcription and semantic search on Modal"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.13",
    # Task 6's tests import migration/chroma_migrate.py, which does
    # `import numpy as np` at module scope (chroma_migrate.py:17) and needs a
    # real Collection surface. Without these the test file fails collection.
    "numpy>=2.0",
    "chromadb==1.5.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["corpus", "tests"]
# Scoped to what this task owns. The repo root and migration/ predate this
# work (pre-existing lint violations, and `ruff format` will also rewrite
# fenced Python code blocks inside unrelated .md docs if pointed at the
# whole tree) -- fixing either is scope creep for Task 1.
include = ["corpus/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
# Without this, isort can't tell `corpus` apart from a third-party package
# and merges it into the same import group as `pytest`.
known-first-party = ["corpus"]

[tool.mypy]
python_version = "3.12"
files = ["corpus", "tests"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "migration.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
