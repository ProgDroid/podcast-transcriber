[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Serverless podcast transcription and semantic search on Modal"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.13",
    # Task 6's tests import migration/chroma_migrate.py, which does
    # `import numpy as np` at module scope (chroma_migrate.py:17) and needs a
    # real Collection surface. Without these the test file fails collection.
    "numpy>=2.0",
    "chromadb==1.5.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["corpus", "tests"]
# Legacy files predating this work: 23 pre-existing lint violations that are
# not this project's to fix. Everything else -- corpus/, tests/, and the new
# migration/ modules later tasks add -- is linted. Excluding by name rather
# than including by glob means new files are covered by default; a glob would
# silently leave them unlinted.
#
# docs/ is separately excluded: `ruff format` (0.16.5) rewrites fenced
# ```python blocks inside .md files in place, and does so destructively when
# a fragment isn't valid standalone syntax (observed: stray wrapping parens
# inserted around a tuple literal, and indentation flattened inside a
# fenced block that continued from surrounding prose). Reproduced twice --
# `uv run ruff format .` and `uv run ruff format --check <file>` both alter
# docs/superpowers/plans/2026-08-31-corpus-integrity.md every run. That file
# is the source of truth for the rest of this plan, so it and the rest of
# docs/ (none of it is source this project's lint config is meant to reach)
# are excluded outright rather than fixed file-by-file.
extend-exclude = [
    "transcribe.py",
    "mcp_server.py",
    "upload_book.py",
    "migration/chroma_migrate.py",
    "migration/migrate.py",
    "migration/validate.py",
    "migration/selftest.py",
    "docs/",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
# Without this, isort can't tell `corpus` apart from a third-party package
# and merges it into the same import group as `pytest`.
known-first-party = ["corpus"]

[tool.mypy]
python_version = "3.12"
files = ["corpus", "tests"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "migration.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
